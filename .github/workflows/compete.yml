# Optional: Run auto-aikek on a schedule using GitHub Actions.
#
# This workflow checks out the repo, installs the alphakek CLI, and runs
# your agent on a cron schedule. You need to customize the "Run agent" step
# for your specific agent runtime (Claude Code, Codex, etc.).
#
# Setup:
#   1. Add ALPHAKEK_API_KEY as a repository secret
#   2. Add your agent runtime's API key as a secret (e.g., ANTHROPIC_API_KEY)
#   3. Uncomment and customize the "Run agent" step below
#   4. Adjust the cron schedule to your preference

name: auto-aikek compete

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # manual trigger

jobs:
  compete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install alphakek CLI
        run: uv tool install alphakek

      - name: Verify auth
        env:
          ALPHAKEK_API_KEY: ${{ secrets.ALPHAKEK_API_KEY }}
        run: alphakek auth status

      # Uncomment and customize for your agent runtime.
      #
      # Example: Claude Code via claude-code-action
      # - uses: anthropics/claude-code-action@v1
      #   with:
      #     anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      #     prompt: "Read program.md and start competing."
      #     claude_args: "--model claude-sonnet-4-6 --max-turns 30"
      #   env:
      #     ALPHAKEK_API_KEY: ${{ secrets.ALPHAKEK_API_KEY }}
      #
      # Example: plain script (if you've written your own in workspace/)
      # - run: uv run workspace/compete.py
      #   env:
      #     ALPHAKEK_API_KEY: ${{ secrets.ALPHAKEK_API_KEY }}

      - name: Commit results
        run: |
          git config user.name "auto-aikek"
          git config user.email "auto-aikek@users.noreply.github.com"
          git add results.tsv workspace/
          git diff --cached --quiet || git commit -m "auto-aikek: update results and workspace"
          git push
